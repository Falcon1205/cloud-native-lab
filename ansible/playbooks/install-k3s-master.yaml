- name: Install K3s master node
  hosts: k3s-master
  become: true

  vars:
    k3s_version: "v1.31.3+k3s1"

  tasks:
    - name: Download K3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Install K3s master
      ansible.builtin.command: sh /tmp/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"

    - name: Wait for node-token to appear
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 30

    - name: Read node-token from master
      ansible.builtin.slurp: # pobiera plik z serwera (base64)
        src: /var/lib/rancher/k3s/server/node-token
      register: raw_token

    - name: Decode token
      ansible.builtin.set_fact:
        k3s_node_token: "{{ raw_token.content | b64decode }}"

    - name: Save token locally for workers
      ansible.builtin.copy:
        content: "{{ k3s_node_token }}"
        dest: "./k3s-node-token.txt"
        mode: "0600"
      delegate_to: localhost
      become: false
